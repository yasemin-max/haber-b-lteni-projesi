databases:
  - name: gundem-db
    databaseName: gundem
    user: gundem
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: gundem-haber-ajansi
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    disk:
      name: gundem-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: gundem-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: MEDIA_RETENTION_DAYS
        value: "30"
      - key: ENABLE_AUTOMATION
        value: "true"
      - key: BULTEN_MAX_ITEM
        value: "10"
      - key: BULTEN_TR_QUOTA
        value: "3"
      - key: ANA_SPIKER
        value: "Türkiye Spikeri"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
